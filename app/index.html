<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA 6 Cover Art Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>GTA 6 Cover Art Maker</h1>
    <p>Upload photos to build your GTA 6 cover art.</p>
    <label>Photo 1 <input id="photo1" type="file" accept="image/*"></label>
    <label>Photo 2 <input id="photo2" type="file" accept="image/*"></label>
    <label>Photo 3 <input id="photo3" type="file" accept="image/*"></label>
    <label>Caption <input id="caption" type="text" maxlength="40" value="VICE CITY"></label>
    <button id="export" type="button">Export PNG 1080 x 1080</button>
    <p id="status" role="status"></p>
  </section>
  <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
